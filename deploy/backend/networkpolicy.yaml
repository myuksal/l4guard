# Deny-by-default policy for the backend node. Only Guard may reach the P2P
# and RPC ports, and the backend may only reach Guard's private listeners plus
# explicitly listed internal dependencies.
#
# NetworkPolicy cannot route traffic through a proxy; this policy only closes
# the direct paths. Guard's fixed upstream configuration is what makes the
# allowed path go through Guard.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blockchain-node
  namespace: blockchain
  labels:
    app.kubernetes.io/name: blockchain-node
    app.kubernetes.io/part-of: blockchain
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blockchain-node
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: l4guard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: l4guard
      ports:
        - protocol: TCP
          port: 26656
        - protocol: TCP
          port: 26657
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Backend -> Guard private outbound relay listeners.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: l4guard
          podSelector:
            matchLabels:
              app.kubernetes.io/name: l4guard
      ports:
        - protocol: TCP
          port: 31001
        - protocol: TCP
          port: 31002
        - protocol: TCP
          port: 32001
        # Some CNIs match the pre-DNAT Service port.
        - protocol: TCP
          port: 443
    # Add only the internal dependencies this node actually needs. For example,
    # a separate execution/consensus client, a metrics collector, or a snapshot
    # store. Do not add a default allow-all egress rule.
    #
    # - to:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: internal
    #   ports:
    #     - protocol: TCP
    #       port: 8545
