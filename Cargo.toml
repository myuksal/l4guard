[package]
name = "l4guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "L4 TCP guard proxy for blockchain nodes"
publish = false

[dependencies]
httparse = "1.10.1"
ipnet = { version = "2.12.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
